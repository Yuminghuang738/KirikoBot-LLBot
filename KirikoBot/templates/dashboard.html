<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KirikoBot 控制台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body>
<aside>
  <div class="brand">
    <span class="logo">🌸</span>
    <span class="dot" id="statusDot" title="机器人状态"></span>
    <span>Kiriko<span>Bot</span></span>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换日间 / 夜间模式">🌙</button>
  </div>

  <nav id="sidenav">
    <div id="navPill"></div>
    <div class="nav-group">概览</div>
    <a class="active" data-page="overview"><span class="ico">📊</span>总览</a>
    <a data-page="logs"><span class="ico">📡</span>实时日志</a>

    <div class="nav-group">对话与用户</div>
    <a data-page="chat"><span class="ico">💬</span>对话记录</a>
    <a data-page="messages"><span class="ico">📨</span>群消息</a>
    <a data-page="profiles"><span class="ico">👤</span>用户画像</a>
    <a data-page="affection"><span class="ico">💕</span>好感度</a>
    <a data-page="learning"><span class="ico">🧠</span>自学习</a>

    <div class="nav-group">内容与工具</div>
    <a data-page="reminders"><span class="ico">⏰</span>提醒</a>
    <a data-page="tarot"><span class="ico">🃏</span>塔罗</a>
    <a data-page="stickers"><span class="ico">🎨</span>表情包</a>
    <a data-page="amps"><span class="ico">🎸</span>箱头库</a>
    <a data-page="features"><span class="ico">📋</span>功能清单</a>

    <div class="nav-group">系统</div>
    <a data-page="versions"><span class="ico">📦</span>版本日志</a>
    <a data-page="groups"><span class="ico">👥</span>群管理</a>
    <a data-page="activity"><span class="ico">📈</span>群活跃</a>
    <a data-page="history"><span class="ico">🗂️</span>聊天回看</a>
    <a data-page="ai"><span class="ico">🤖</span>AI 用量</a>
    <a data-page="push"><span class="ico">🔔</span>群推送</a>
    <a data-page="settings"><span class="ico">⚙️</span>群设置</a>

    <div class="nav-group">LLBot 连接</div>
    <a data-page="llbot"><span class="ico">🔌</span>连接状态</a>
    <a data-page="webqq"><span class="ico">🖥️</span>WebQQ</a>
  </nav>

  <div class="aside-foot">
    <div id="statusBar">● 正在连接…</div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div class="tb-crumb">
      <span class="tb-root">KirikoBot</span>
      <span class="tb-sep">/</span>
      <span class="tb-title" id="tbTitle">总览</span>
    </div>
    <div class="tb-right" id="tbRight"></div>
  </div>
  <div class="content" id="mainContent"></div>
</main>

<script>window.__KIRIKO__={llbotPublicUrl:{{ llbot_public_url|tojson }}};</script>
<script src="/static/js/app.js?v={{ asset_v }}"></script>
</body>
</html>
